fetch:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: garmin_personal
    endpoint:
      required: true
      example: daily_summary
      selector:
        select:
          translation_key: endpoint
          custom_value: false
          mode: dropdown
          options:
            - activities
            - activity
            - activity_workouts
            - hr_zones
            - fitness_age
            - weight_goals
            - hrv
            - hrv_summaries
            - nutrition
            - menstrual_summary
            - menstrual_day
            - sleep
            - sleep_summaries
            - profile
            - hydration
            - steps
            - stress
            - daily_summary
            - daily_summaries
            - weights_all
            - weight_range
            - body_battery
            - spo2
            - heart_rate
            - wellness_activities
    date:
      example: "2026-10-01"
      selector:
        date:
    start_date:
      example: "2026-09-25"
      selector:
        date:
    end_date:
      example: "2026-10-01"
      selector:
        date:
    activity_id:
      example: 12345678901
      selector:
        number:
          min: 1
          max: 99999999999999
          mode: box
    filters:
      example: {"activity_type": "running", "min_distance": 10000, "favorite": false}
      selector:
        object:
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 500
          mode: box
search_activities:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: garmin_personal
    filters:
      example: {"activity_type": "running", "min_distance": 10000, "favorite": false}
      selector:
        object:
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 500
          mode: box
download_activity:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: garmin_personal
    activity_id:
      required: true
      example: 12345678901
      selector:
        number:
          min: 1
          max: 99999999999999
          mode: box
    path:
      example: /media/garmin_personal/activity_12345678901.zip
      selector:
        text:
backfill_statistics:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: garmin_personal
    start_date:
      example: "2026-01-01"
      selector:
        date:
    end_date:
      example: "2026-10-23"
      selector:
        date:
    days:
      default: 90
      example: 365
      selector:
        number:
          min: 1
          max: 3650
          unit_of_measurement: d
          mode: box
    include_third_party_steps:
      default: false
      selector:
        boolean:
backfill_intraday:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: garmin_personal
    start_date:
      example: "2026-10-01"
      selector:
        date:
    end_date:
      example: "2026-10-23"
      selector:
        date:
    days:
      default: 7
      example: 30
      selector:
        number:
          min: 1
          max: 366
          unit_of_measurement: d
          mode: box
backfill_history:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: garmin_personal
    start_date:
      example: "2026-10-23"
      selector:
        date:
    end_date:
      example: "2026-10-23"
      selector:
        date:
    days:
      default: 1
      selector:
        number:
          min: 1
          max: 31
          unit_of_measurement: d
          mode: box
    series:
      example: heart_rate
      selector:
        select:
          multiple: true
          options:
            - heart_rate
            - body_battery
            - spo2
            - hrv
    confirm_rewrite:
      default: false
      selector:
        boolean:
