name: Release
on:
  push:
    branches: [main]
    paths:
      - custom_components/garmin_personal/manifest.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # A release goes out only after the tests, the lint and hassfest are green.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.9"
      - run: ruff check .
      - run: |
          for t in tests/test_*.py; do python3 -I "$t" || exit 1; done
  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
  release:
    needs: [tests, hassfest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version lesen
        id: version
        run: echo "tag=v$(python3 -c "import json;print(json.load(open('custom_components/garmin_personal/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Prüfen, ob das Release schon existiert
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: ZIP der Integration bauen
        if: steps.exists.outputs.found == 'false'
        run: |
          cd custom_components/garmin_personal
          zip -r ../../garmin_personal.zip . -x "__pycache__/*" "*.pyc"
      - name: Release anlegen
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.tag }}"
          python3 - "$v" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1].lstrip("v")
          m = re.search(r"^## " + re.escape(v) + r"\n(.*?)(?=^## |\Z)", open("CHANGELOG.md").read(), re.S | re.M)
          print(m.group(1).strip() if m else "")
          PY
          if [ -s notes.md ]; then n="--notes-file notes.md"; else n="--generate-notes"; fi
          gh release create "$v" garmin_personal.zip --target "$GITHUB_SHA" --title "$v" $n
