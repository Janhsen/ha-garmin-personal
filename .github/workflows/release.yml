name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP der Integration bauen
        run: |
          cd custom_components/garmin_personal
          zip -r ../../garmin_personal.zip . -x "__pycache__/*" "*.pyc"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" garmin_personal.zip --title "$GITHUB_REF_NAME" --generate-notes
